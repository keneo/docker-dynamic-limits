name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dind-e2e:
    name: Docker-in-Docker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build E2E Docker image
        run: docker build -t ddl-e2e -f e2e/Dockerfile .

      - name: Run E2E tests
        run: docker run --privileged ddl-e2e

  host-e2e:
    name: Host E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install gcc (CGO for sqlite3)
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Pull alpine image
        run: docker pull alpine:latest

      - name: Run E2E tests on host
        run: CGO_ENABLED=1 go test -tags e2e -v -count=1 -timeout 120s ./e2e/

  cli-proxy-e2e:
    name: CLI Proxy E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc python3 curl jq

      - name: Run CLI proxy E2E tests
        run: bash e2e/cli_proxy_test.sh
